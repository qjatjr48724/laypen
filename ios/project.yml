name: Laypen
options:
  bundleIdPrefix: com.laypen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: PW795XA9ST
  CODE_SIGN_STYLE: Automatic
targets:
  Laypen:
    type: application
    platform: iOS
    sources:
      - path: Laypen
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
      - path: Link
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.laypen.app
      INFOPLIST_FILE: Laypen/Info.plist
      CODE_SIGN_ENTITLEMENTS: Laypen/Laypen.entitlements
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "2"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LaypenShare
        embed: true
  LaypenShare:
    type: app-extension
    platform: iOS
    sources:
      - path: LaypenShare
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.laypen.app.share
      INFOPLIST_FILE: LaypenShare/Info.plist
      CODE_SIGN_ENTITLEMENTS: LaypenShare/LaypenShare.entitlements
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "2"
      SKIP_INSTALL: true
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  LaypenMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Link
    settings:
      PRODUCT_NAME: LaypenMac
      PRODUCT_BUNDLE_IDENTIFIER: com.laypen.mac
      INFOPLIST_FILE: Mac/Info.plist
      CODE_SIGN_ENTITLEMENTS: Mac/LaypenMac.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: false
      MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  Laypen:
    build:
      targets:
        Laypen: all
        LaypenShare: all
    run:
      config: Debug
  LaypenMac:
    build:
      targets:
        LaypenMac: all
    run:
      config: Debug
